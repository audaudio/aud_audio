name: aud_audio
description: "The Audanika Audio Engine: a Flutter audio graph defined in Dart and rendered in C++, on iOS, Android and macOS"
version: 0.5.4
publish_to: none
homepage: https://github.com/audaudio/aud_audio
repository: https://github.com/audaudio/aud_audio

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

# The first 0.x releases target iOS and Android (release-001); macOS
# joins with the Audanika Mac app (release-005).
platforms:
  android:
  ios:
  macos:

workspace:
  - example

# The family is pinned to exact versions (family-001).
dependencies:
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.6.2
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.6.4
  aud_audio_io:
    git:
      url: git@github.com:audaudio/aud_audio_io.git
      tag_pattern: "{{version}}"
    version: ^0.5.2
  aud_audio_web:
    git:
      url: git@github.com:audaudio/aud_audio_web.git
      tag_pattern: "{{version}}"
    version: ^0.1.2
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  # The example plays the sampler. Declared here too, so that tools that
  # read only this manifest see the dependency of the example.
  aud_dsp_sampler:
    git:
      url: git@github.com:audaudio/aud_dsp_sampler.git
      tag_pattern: "{{version}}"
    version: ^0.5.1
  dna_audanika: ^0.1.0
  flutter_lints: ^6.0.0
  # Within the test_api that flutter_test of the example pins.
  test: ^1.32.0