name: aud_audio
description: "The Audanika Audio Engine: a Flutter audio graph defined in Dart and rendered in C++, on iOS, Android and macOS"
version: 0.4.3
publish_to: none
homepage: https://github.com/audaudio/aud_audio
repository: https://github.com/audaudio/aud_audio

environment:
  sdk: ^3.12.2

# The first 0.x releases target iOS and Android (release-001); macOS
# joins with the Audanika Mac app (release-005).
platforms:
  android:
  ios:
  macos:

# The family is pinned to exact versions (family-001).
dependencies:
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: 0.5.3
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: 0.5.4
  aud_audio_io:
    git:
      url: git@github.com:audaudio/aud_audio_io.git
      tag_pattern: "{{version}}"
    version: 0.3.5
  aud_audio_web:
    git:
      url: git@github.com:audaudio/aud_audio_web.git
      tag_pattern: "{{version}}"
    version: 0.0.9
  ffi: ^2.2.0
  flutter:
    sdk: flutter

dev_dependencies:
  dna_audanika: ^0.0.2
  flutter_lints: ^6.0.0
  helix: ^1.13.0
  test: ^1.33.0