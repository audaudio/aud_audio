name: aud_audio
description: "The Audanika Audio Engine: a Flutter audio graph defined in Dart and rendered in C++ on iOS, Android, macOS, Windows, Linux and Web"
version: 0.0.1
publish_to: none
homepage: https://github.com/audaudio/aud_audio
repository: https://github.com/audaudio/aud_audio

environment:
  sdk: ^3.12.2

# Add regular dependencies here.
dependencies:
  aud_audio_core:
    git:
      url: git@github.com:audaudio/aud_audio_core.git
      tag_pattern: "{{version}}"
    version: ^0.0.2
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.0.2
  aud_audio_io:
    git:
      url: git@github.com:audaudio/aud_audio_io.git
      tag_pattern: "{{version}}"
    version: ^0.0.2
  aud_audio_web:
    git:
      url: git@github.com:audaudio/aud_audio_web.git
      tag_pattern: "{{version}}"
    version: ^0.0.2
  # path: ^1.9.0

dev_dependencies:
  dna_audanika: ^0.0.2
  helix: ^1.11.0
  lints: ^6.1.0
  test: ^1.32.0