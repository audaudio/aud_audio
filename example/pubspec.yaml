name: aud_audio_example
description: "Example app of the Audanika Audio Engine: oscillator, filter and output, and the SFZ sampler with a keyboard, on iOS and Android, with the numbers of the engine."
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  aud_audio:
    path: ../
  aud_dsp_sampler:
    git:
      url: git@github.com:audaudio/aud_dsp_sampler.git
      tag_pattern: "{{version}}"
    version: ^0.4.0
  aud_audio_midi:
    git:
      url: git@github.com:audaudio/aud_audio_midi.git
      tag_pattern: "{{version}}"
    version: ^0.1.6
  aud_midi: ^0.1.4
  ffi: ^2.2.0
  aud_midi_standard: ^0.1.1
  path_provider: ^2.1.6
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
