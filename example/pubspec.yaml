name: aud_audio_example
description: "Example app of the Audanika Audio Engine: oscillator, filter and output on iOS and Android, with the numbers of the engine."
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  aud_audio:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

# The example runs against the sibling checkouts of the ticket.
dependency_overrides:
  aud_audio_core:
    path: ../../aud_audio_core
  aud_audio_graph:
    path: ../../aud_audio_graph
  aud_audio_io:
    path: ../../aud_audio_io
  aud_audio_web:
    path: ../../aud_audio_web

flutter:
  uses-material-design: true
