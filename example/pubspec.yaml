name: aud_audio_example
description: "Example app of the Audanika Audio Engine: oscillator, filter and output, and the SFZ sampler with a keyboard, on iOS and Android, with the numbers of the engine."
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  aud_audio:
    path: ../
  aud_dsp_sampler:
    git:
      url: git@github.com:audaudio/aud_dsp_sampler.git
      tag_pattern: "{{version}}"
    version: ^0.5.1
  aud_midi_standard: ^0.3.1
  path_provider: ^2.1.6

  material_ui: any
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
